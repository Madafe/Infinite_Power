version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: infpower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: infinite_power
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=infinite_power
      - DB_POSTGRESDB_USER=infpower
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
    volumes:
      - ./data/n8n:/home/node/.n8n
    depends_on:
      - postgres

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:20128:20128"
    environment:
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      - STORAGE_ENCRYPTION_KEY_VERSION=${OMNIROUTE_STORAGE_ENCRYPTION_KEY_VERSION}
    volumes:
      - ./data/omniroute:/app/data
